name: PeopleFlow issue agent
on:
  issues:
    types: [opened, reopened]
permissions: {}
concurrency:
  group: peopleflow-issue-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  implement:
    if: github.event.issue.author_association == 'OWNER' || github.event.issue.author_association == 'MEMBER' || github.event.issue.author_association == 'COLLABORATOR'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          sandbox: workspace-write
          prompt: |
            Implement this PeopleFlow issue in the staging checkout. Read AGENTS.md.
            Deliver all affected UI, API, database migrations and focused tests.
            For schema changes add a new migration. Run npm run check and npm run test:demo.
            Diagnose failures and retry your fixes. Preserve existing regression assertions.
            Leave publication to the workflow. Do not edit workflow or agent instructions.
            Issue: ${{ github.event.issue.title }}
            Description: ${{ github.event.issue.body }}
      - name: Export changes against the original checkout
        run: |
          git add -A
          base=$(git rev-parse HEAD)
          git diff --cached --binary "$base" > "$RUNNER_TEMP/issue.patch"
          test -s "$RUNNER_TEMP/issue.patch"
          git diff --cached --quiet "$base" -- .github AGENTS.md
      - uses: actions/upload-artifact@v7
        with:
          name: issue-patch
          path: ${{ runner.temp }}/issue.patch

  verify:
    needs: implement
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          name: issue-patch
          path: ${{ runner.temp }}/proposal
      - run: git apply --index "$RUNNER_TEMP/proposal/issue.patch"
      - run: npm ci
      - run: npm run check
      - run: npm run test:demo
      - name: Test migrations and seed in disposable local Supabase
        run: |
          npx --no-install supabase start
          npx --no-install supabase db lint --local --fail-on error

  publish:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    env:
      ISSUE: ${{ github.event.issue.number }}
      BASE: staging
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging
      - uses: actions/download-artifact@v4
        with:
          name: issue-patch
          path: ${{ runner.temp }}/proposal
      - name: Publish the tested change and merge
        run: |
          git fetch origin "$BASE"
          branch="agent/issue-$ISSUE-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          git switch -c "$branch" "origin/$BASE"
          git apply --index "$RUNNER_TEMP/proposal/issue.patch"
          git diff --cached --quiet -- .github AGENTS.md
          git -c user.name='PeopleFlow Agent' -c user.email='github-actions[bot]@users.noreply.github.com' commit -m "Implement #$ISSUE"
          git push origin "$branch"
          pr=$(gh pr create --base "$BASE" --head "$branch" --title "PeopleFlow #$ISSUE" --body "Closes #$ISSUE")
          gh pr merge "$pr" --squash --match-head-commit "$(git rev-parse HEAD)" --delete-branch

  report:
    needs: [implement, verify, publish]
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number }}
        run: gh issue comment "$ISSUE" --repo "$GITHUB_REPOSITORY" --body "La livraison a échoué. Journal de l’exécution — $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
