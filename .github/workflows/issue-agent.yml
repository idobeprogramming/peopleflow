# The single delivery chain of an issue: triage or existing patch -> Claude -> guardrails ->
# independent checks -> last look at the issue -> one PR, opened or updated.
# Started by agent-events.yml (or by hand, which requires write access). One run per issue at a time.
name: Agent d'issue
run-name: "Agent d'issue #${{ inputs.issue }} (${{ inputs.mode }})"

on:
  workflow_dispatch:
    inputs:
      issue:
        description: Numéro de l'issue
        required: true
      mode:
        description: Raison du lancement
        type: choice
        options: [start, resume, update, adapt, correct, review]
        default: update
      seed_run:
        description: Run dont le patch non publié est repris
        default: ''
      log_run:
        description: Run dont le journal en échec est à corriger
        default: ''
      review_run:
        description: Run de revue dont les défauts sont à corriger
        default: ''
      head_sha:
        description: Commit de la PR visé; un commit plus récent annule le run
        default: ''

permissions: {}

concurrency:
  group: agent-issue-${{ inputs.issue }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Préparation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
      issues: write
      pull-requests: write
    outputs:
      path: ${{ steps.prepare.outputs.path }}
      base_branch: ${{ steps.prepare.outputs.base_branch }}
      base_sha: ${{ steps.prepare.outputs.base_sha }}
      pr: ${{ steps.prepare.outputs.pr }}
      branch: ${{ steps.prepare.outputs.branch }}
      labels: ${{ steps.prepare.outputs.labels }}
      title: ${{ steps.prepare.outputs.title }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          sparse-checkout: scripts/agent
      - id: prepare
        run: node scripts/agent/cli.mjs prepare .agent
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ inputs.issue }}
          MODE: ${{ inputs.mode }}
          SEED_RUN: ${{ inputs.seed_run }}
          LOG_RUN: ${{ inputs.log_run }}
          REVIEW_RUN: ${{ inputs.review_run }}
          HEAD_SHA: ${{ inputs.head_sha }}
          AGENT_BASE_BRANCH: ${{ vars.AGENT_BASE_BRANCH }}
          AGENT_MAINTAINER: ${{ vars.AGENT_MAINTAINER }}
          HAS_CLAUDE: ${{ secrets.ANTHROPIC_API_KEY != '' || secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
          HAS_APP: ${{ vars.AGENT_APP_ID != '' && secrets.AGENT_APP_PRIVATE_KEY != '' }}
      - if: steps.prepare.outputs.path != 'stop'
        uses: actions/upload-artifact@v7
        with:
          name: agent-context
          path: .agent/
          include-hidden-files: true
          overwrite: true
          retention-days: 7

  triage:
    name: Triage
    needs: prepare
    if: needs.prepare.outputs.path == 'triage'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    outputs:
      action: ${{ steps.decide.outputs.action }}
      comment: ${{ steps.decide.outputs.comment }}
      reason: ${{ steps.decide.outputs.reason }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.base_sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: agent-context
          path: .agent
      - name: Triage par Claude
        uses: anthropics/claude-code-action@acfe7992852970efb4fee683d63d628e3e52df67 # v1
        with:
          # Either a Console API key or a subscription token from `claude setup-token` (Pro/Max).
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          # agent-events.yml dispatches this workflow with the workflow token.
          allowed_bots: github-actions
          prompt: Lis .agent/triage.prompt.md et suis exactement ses consignes.
          claude_args: >-
            --max-turns 30
            --allowedTools "Read,Glob,Grep,Write"
            ${{ vars.AGENT_TRIAGE_MODEL && format('--model {0}', vars.AGENT_TRIAGE_MODEL) || '' }}
      # Checked out after Claude worked, so the deciding code is untouched.
      - uses: actions/checkout@v7
        with:
          path: .trusted
          persist-credentials: false
          sparse-checkout: scripts/agent
      - name: Décider
        id: decide
        env:
          LABELS: ${{ needs.prepare.outputs.labels }}
        run: node .trusted/scripts/agent/cli.mjs triage .agent/triage.json "$LABELS"
      - uses: actions/upload-artifact@v7
        with:
          name: agent-plan
          path: |
            .agent/triage.plan.md
            .agent/triage.questions.json
          if-no-files-found: ignore
          include-hidden-files: true
          overwrite: true
          retention-days: 7

  announce:
    name: Publier le triage
    needs: [prepare, triage]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
      issues: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      ISSUE: ${{ inputs.issue }}
      ACTION: ${{ needs.triage.outputs.action }}
      COMMENT: ${{ needs.triage.outputs.comment }}
      REASON: ${{ needs.triage.outputs.reason }}
      AGENT_MAINTAINER: ${{ vars.AGENT_MAINTAINER }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          sparse-checkout: scripts/agent
      - if: needs.triage.outputs.action == 'ask'
        uses: actions/download-artifact@v8
        with:
          name: agent-plan
          path: ${{ runner.temp }}/plan
      - run: |
          case "$ACTION" in
            ask) node scripts/agent/cli.mjs ask "$RUNNER_TEMP/plan/triage.questions.json" ;;
            implement) gh issue comment "$ISSUE" --repo "$REPO" --body "$COMMENT" ;;
            human)
              gh issue comment "$ISSUE" --repo "$REPO" --body "$COMMENT"
              node scripts/agent/cli.mjs stop ;;
            fail) node scripts/agent/cli.mjs stop ;;
          esac

  implement:
    name: Implémentation
    needs: [prepare, triage]
    if: >-
      !cancelled()
      && (needs.prepare.outputs.path == 'fix'
        || (needs.triage.result == 'success' && needs.triage.outputs.action == 'implement'))
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
      id-token: write
    outputs:
      outcome: ${{ steps.export.outputs.outcome }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.base_sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          pattern: agent-*
          path: .agent
          merge-multiple: true
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Reprendre le patch non publié
        run: |
          if [ -s .agent/previous.patch ]; then
            git apply --index .agent/previous.patch || echo "::notice::La base a changé : Claude reprend le patch à la main."
          fi
      - run: npm ci
      - name: Implémentation par Claude
        uses: anthropics/claude-code-action@acfe7992852970efb4fee683d63d628e3e52df67 # v1
        with:
          # Either a Console API key or a subscription token from `claude setup-token` (Pro/Max).
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          allowed_bots: github-actions
          prompt: Lis .agent/${{ needs.prepare.outputs.path == 'fix' && 'fix' || 'implement' }}.prompt.md et suis exactement ses consignes.
          claude_args: >-
            --max-turns 80
            --allowedTools "Read,Glob,Grep,Edit,Write,Bash(npm ci),Bash(npm test:*),Bash(npm run:*),Bash(npx vitest:*),Bash(npx tsc:*),Bash(git status:*),Bash(git diff:*),Bash(git log:*),Bash(ls:*)"
            ${{ vars.AGENT_MODEL && format('--model {0}', vars.AGENT_MODEL) || '' }}
      - name: Exporter le patch
        id: export
        env:
          BASE: ${{ needs.prepare.outputs.base_sha }}
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          git add -A
          git diff --cached --binary "$BASE" > "$RUNNER_TEMP/out/proposal.patch"
          cp .agent/report.json "$RUNNER_TEMP/out/report.json" || echo '{}' > "$RUNNER_TEMP/out/report.json"
          if jq -e '(.questions // []) | length > 0' "$RUNNER_TEMP/out/report.json" > /dev/null; then
            echo "outcome=ask" >> "$GITHUB_OUTPUT"
          elif [ -s "$RUNNER_TEMP/out/proposal.patch" ]; then
            echo "outcome=propose" >> "$GITHUB_OUTPUT"
          else
            echo "outcome=empty" >> "$GITHUB_OUTPUT"
          fi
          git diff --cached --stat "$BASE" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: proposal
          path: ${{ runner.temp }}/out/
          overwrite: true
          retention-days: 14

  ask:
    name: Question ou absence de changement
    needs: [prepare, implement]
    if: >-
      !cancelled() && needs.implement.result == 'success'
      && needs.implement.outputs.outcome != 'propose'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
      issues: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      ISSUE: ${{ inputs.issue }}
      OUTCOME: ${{ needs.implement.outputs.outcome }}
      AGENT_MAINTAINER: ${{ vars.AGENT_MAINTAINER }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          sparse-checkout: scripts/agent
      - uses: actions/download-artifact@v8
        with:
          name: proposal
          path: ${{ runner.temp }}/proposal
      - run: |
          if [ "$OUTCOME" = ask ]; then
            node scripts/agent/cli.mjs ask "$RUNNER_TEMP/proposal/report.json"
          else
            REASON="Claude n'a proposé aucun changement. $(jq -r '[.summary // empty, (.openQuestions // [])[]] | join(" ")' "$RUNNER_TEMP/proposal/report.json" | head -c 1500)" \
              node scripts/agent/cli.mjs stop
          fi

  guard:
    name: Garde-fous
    needs: [prepare, implement]
    if: "!cancelled() && needs.implement.result == 'success' && needs.implement.outputs.outcome == 'propose'"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      verdict: ${{ steps.guard.outputs.verdict }}
      comment: ${{ steps.guard.outputs.comment }}
      changed_lines: ${{ steps.guard.outputs.changed_lines }}
    steps:
      # The guard code comes from the default branch; the proposal is applied next to it, never run.
      - uses: actions/checkout@v7
        with:
          path: trusted
          persist-credentials: false
          sparse-checkout: scripts/agent
      - uses: actions/checkout@v7
        with:
          path: work
          ref: ${{ needs.prepare.outputs.base_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: proposal
          path: ${{ runner.temp }}/proposal
      # On an existing PR the rules apply to the whole PR: a small correction of code whose test
      # is already in the PR is not "code without a test".
      - name: Reconstituer le diff complet
        env:
          BASE_BRANCH: ${{ needs.prepare.outputs.base_branch }}
        run: |
          git -C work apply --index "$RUNNER_TEMP/proposal/proposal.patch"
          base=$(git -C work merge-base HEAD "origin/$BASE_BRANCH")
          git -C work diff --cached --binary "$base" > "$RUNNER_TEMP/full.patch"
      - id: guard
        env:
          LABELS: ${{ needs.prepare.outputs.labels }}
        run: node trusted/scripts/agent/cli.mjs guard "$RUNNER_TEMP/full.patch" "$LABELS"

  stopped:
    name: Arrêt par les garde-fous
    needs: [prepare, guard]
    if: "!cancelled() && needs.guard.result == 'success' && needs.guard.outputs.verdict != 'ok'"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      ISSUE: ${{ inputs.issue }}
      COMMENT: ${{ needs.guard.outputs.comment }}
      AGENT_MAINTAINER: ${{ vars.AGENT_MAINTAINER }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          sparse-checkout: scripts/agent
      - run: |
          gh issue comment "$ISSUE" --repo "$REPO" --body "$COMMENT"
          REASON="les garde-fous ont arrêté le patch, conservé dans les artefacts de l'exécution." node scripts/agent/cli.mjs stop

  verify:
    name: Vérification indépendante
    needs: [prepare, guard]
    if: "!cancelled() && needs.guard.result == 'success' && needs.guard.outputs.verdict == 'ok'"
    # A called workflow can only use permissions its caller grants; the workflow default is none.
    permissions:
      contents: read
    uses: ./.github/workflows/checks.yml
    with:
      ref: ${{ needs.prepare.outputs.base_sha }}
      patch-artifact: proposal

  publish:
    name: Publication
    needs: [prepare, guard, verify]
    if: "!cancelled() && needs.verify.result == 'success'"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write
      contents: read
      issues: write
      pull-requests: write
    env:
      ISSUE: ${{ inputs.issue }}
      BASE_BRANCH: ${{ needs.prepare.outputs.base_branch }}
      BASE_SHA: ${{ needs.prepare.outputs.base_sha }}
      PR: ${{ needs.prepare.outputs.pr }}
      BRANCH: ${{ needs.prepare.outputs.branch }}
      AGENT_MAINTAINER: ${{ vars.AGENT_MAINTAINER }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - uses: actions/checkout@v7
        with:
          path: trusted
          persist-credentials: false
          sparse-checkout: scripts/agent
      - name: Relire la demande avant de publier
        id: fresh
        env:
          GH_TOKEN: ${{ github.token }}
        run: node trusted/scripts/agent/cli.mjs fresh
      # A GitHub App token is required: pull requests opened with GITHUB_TOKEN do not trigger CI.
      - id: app
        if: steps.fresh.outputs.action == 'publish'
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.AGENT_APP_ID }}
          private-key: ${{ secrets.AGENT_APP_PRIVATE_KEY }}
      - if: steps.fresh.outputs.action == 'publish'
        uses: actions/checkout@v7
        with:
          path: work
          ref: ${{ needs.prepare.outputs.base_sha }}
          token: ${{ steps.app.outputs.token }}
          fetch-depth: 0
      - if: steps.fresh.outputs.action == 'publish'
        uses: actions/download-artifact@v8
        with:
          name: proposal
          path: ${{ runner.temp }}/proposal
      - name: Rédiger le rapport
        id: report
        if: steps.fresh.outputs.action == 'publish'
        env:
          CHANGED: ${{ needs.guard.outputs.changed_lines }}
        run: node trusted/scripts/agent/cli.mjs report "$RUNNER_TEMP/proposal/report.json" "$ISSUE" "$CHANGED"
      - name: Ouvrir ou mettre à jour la PR
        id: pr
        if: steps.fresh.outputs.action == 'publish'
        working-directory: work
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          TITLE: ${{ steps.report.outputs.title }}
          ISSUE_TITLE: ${{ needs.prepare.outputs.title }}
        run: |
          git config user.name 'peopleflow-agent[bot]'
          git config user.email 'peopleflow-agent[bot]@users.noreply.github.com'
          if [ -n "$PR" ]; then
            git apply --index "$RUNNER_TEMP/proposal/proposal.patch"
            git commit -q -m "$TITLE" -m "Refs #$ISSUE"
            # Refused when someone pushed meanwhile: never force.
            git push origin "HEAD:refs/heads/$BRANCH"
            gh pr comment "$PR" --body-file "$RUNNER_TEMP/proposal/report.md"
            echo "number=$PR" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          slug=$(printf '%s' "$ISSUE_TITLE" | iconv -f utf8 -t ascii//TRANSLIT | tr '[:upper:]' '[:lower:]' | tr -cs 'a-z0-9' '-' | cut -c1-40 | sed 's/^-//; s/-$//')
          branch="agent/issue-$ISSUE-${slug:-change}-$GITHUB_RUN_ID"
          git switch -c "$branch"
          git apply --index "$RUNNER_TEMP/proposal/proposal.patch"
          git commit -q -m "$TITLE" -m "Closes #$ISSUE"
          if [ "$(git rev-parse "origin/$BASE_BRANCH")" != "$BASE_SHA" ]; then
            echo "$BASE_BRANCH a avancé pendant le travail; rebase."
            git rebase "origin/$BASE_BRANCH" || { git rebase --abort; echo "::error::Conflit avec $BASE_BRANCH."; exit 1; }
          fi
          git push origin "$branch"
          url=$(gh pr create --base "$BASE_BRANCH" --head "$branch" --title "$TITLE" --body-file "$RUNNER_TEMP/proposal/report.md")
          echo "number=${url##*/}" >> "$GITHUB_OUTPUT"
      - name: Prévenir sur l'issue
        if: steps.fresh.outputs.action == 'publish'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ steps.pr.outputs.number }}
          UPDATED: ${{ needs.prepare.outputs.pr != '' }}
        run: |
          node trusted/scripts/agent/cli.mjs published "$RUNNER_TEMP/proposal/report.json"
          verb=$([ "$UPDATED" = true ] && echo "mise à jour" || echo "ouverte")
          if [ "$BASE_BRANCH" = demo/broken-directory-filters ]; then
            next="Branche de démo : fusion automatique après CI et revue réussies."
          else
            next="Elle attend ta revue : rien ne fusionne dans \`$BASE_BRANCH\` sans ton clic."
          fi
          gh issue comment "$ISSUE" --repo "$REPO" --body "✅ PR #$PR $verb. $next"$'\n\n'"Pour la modifier : \`/agent update <précision>\` ici."

  settle:
    name: Signaler l'échec
    needs: [prepare, triage, announce, implement, ask, guard, stopped, verify, publish]
    if: failure()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: gh workflow run agent-events.yml --repo "$REPO" -f run_id="$GITHUB_RUN_ID"
