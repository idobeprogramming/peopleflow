name: Promote staging

on:
  push:
    branches: [staging]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: promote-staging
  cancel-in-progress: true

jobs:
  open-promotion:
    name: Ouvrir la promotion vers main
    runs-on: ubuntu-latest
    steps:
      - name: Ouvrir ou retrouver la pull request
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          ahead=$(gh api "repos/$REPOSITORY/compare/main...staging" --jq '.ahead_by')
          if [ "$ahead" -eq 0 ]; then
            echo "Staging ne contient aucun commit à promouvoir."
            exit 0
          fi
          number=$(gh pr list --repo "$REPOSITORY" --base main --head staging --state open --json number --jq '.[0].number')
          if [ -z "$number" ]; then
            gh pr create               --repo "$REPOSITORY"               --base main               --head staging               --title "Promouvoir staging vers main"               --body "Cette PR contient la version validée de staging. La CI et la revue de main sont obligatoires."
          fi
